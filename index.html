<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doc & 3D Bot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; background: #f5f5f5; }
  header { padding: 12px 20px; background: #fff; border-bottom: 1px solid #ddd; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 1rem; font-weight: 600; }
  #file-label { cursor: pointer; padding: 6px 12px; background: #0070f3; color: #fff; border-radius: 4px; font-size: 0.85rem; }
  #file-label:disabled, #file-label.disabled { background: #aaa; cursor: default; }
  #file-input { display: none; }
  #status { font-size: 0.8rem; color: #555; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 70%; padding: 10px 14px; border-radius: 8px; line-height: 1.5; font-size: 0.9rem; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #0070f3; color: #fff; }
  .bot  { align-self: flex-start; background: #fff; border: 1px solid #ddd; }
  .sources { font-size: 0.75rem; color: #888; margin-top: 6px; }
  footer { padding: 12px 20px; background: #fff; border-top: 1px solid #ddd; display: flex; gap: 8px; }
  #input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.9rem; }
  #send { padding: 8px 16px; background: #0070f3; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
  #send:disabled { background: #aaa; cursor: default; }
  .msg table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  .msg th, .msg td { border: 1px solid #ddd; padding: 6px 10px; font-size: 0.85rem; }
  .msg th { background: #f0f0f0; font-weight: 600; }
  .chart-wrap { width: 100%; max-width: 500px; margin-top: 12px; }
  #setup-panel { display: none; background: #fffbea; border-bottom: 1px solid #f0d080; padding: 12px 20px; }
  #setup-panel h2 { font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  #setup-log { font-family: monospace; font-size: 0.78rem; background: #1e1e1e; color: #d4d4d4; padding: 10px; border-radius: 4px; height: 160px; overflow-y: auto; white-space: pre-wrap; }
  .spinner { display: inline-block; width: 10px; height: 10px; border: 2px solid #ccc; border-top-color: #0070f3; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header>
  <h1>Doc & 3D Bot</h1>
  <label for="provider-select" style="font-size:0.85rem; color:#555">Backend:</label>
  <select id="provider-select" style="padding:5px 8px; border-radius:4px; border:1px solid #ddd; font-size:0.85rem">
    <option value="">-- Select a backend --</option>
    <option value="ollama">Ollama (local)</option>
    <option value="gemini">Gemini API</option>
  </select>
  <label id="file-label" class="disabled" for="file-input" style="opacity:0.5; cursor:not-allowed">Upload file</label>
  <input id="file-input" type="file" accept=".pdf,.txt,.csv,.glb,.stl,model/gltf+binary,application/octet-stream" multiple disabled>
  <button id="tokens-btn" style="padding:6px 12px; background:#f0ad4e; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:0.85rem; display:none" onclick="showTokenUsage()">📊 Token Usage</button>
  <span id="status">Select a backend to begin.</span>
</header>

<div id="setup-panel">
  <h2><span class="spinner" id="setup-spinner"></span><span id="setup-title">Setting up Ollama...</span></h2>
  <div id="setup-log"></div>
</div>

<div id="chat"></div>

<footer>
  <input id="input" type="text" placeholder="Ask about your document or 3D model..." disabled>
  <button id="send" disabled>Send</button>
</footer>

<script>
  let sources = [];
  let currentProvider = null;
  let chartCounter = 0;

  // Configure marked with custom renderer for charts
  const renderer = new marked.Renderer();
  renderer.code = function({ text, lang }) {
    const code = text;
    if (lang === 'chart') {
      const id = `chart-${chartCounter++}`;
      setTimeout(() => {
        try {
          const cfg = JSON.parse(code);
          const ctx = document.getElementById(id);
          if (ctx) new Chart(ctx, {
            type: cfg.type,
            data: { labels: cfg.labels, datasets: cfg.datasets },
            options: { responsive: true, plugins: { title: { display: !!cfg.title, text: cfg.title }}}
          });
        } catch(e) { console.warn('Chart render failed', e); }
      }, 0);
      return `<div class="chart-wrap"><canvas id="${id}"></canvas></div>`;
    }
    return `<pre><code>${code}</code></pre>`;
  };
  marked.use({ renderer });

  const fileInput = document.getElementById("file-input");
  const fileLabel = document.getElementById("file-label");
  const status    = document.getElementById("status");
  const chat      = document.getElementById("chat");
  const input     = document.getElementById("input");
  const send      = document.getElementById("send");
  const providerSelect = document.getElementById("provider-select");

  const setupPanel   = document.getElementById("setup-panel");
  const setupLog     = document.getElementById("setup-log");
  const setupTitle   = document.getElementById("setup-title");
  const setupSpinner = document.getElementById("setup-spinner");

  function enableUpload() {
    fileInput.disabled = false;
    fileLabel.classList.remove("disabled");
    fileLabel.style.opacity = "1";
    fileLabel.style.cursor = "pointer";
  }

  function disableUpload() {
    fileInput.disabled = true;
    fileLabel.classList.add("disabled");
    fileLabel.style.opacity = "0.5";
    fileLabel.style.cursor = "not-allowed";
  }

  async function checkOllamaSetup() {
    disableUpload();
    status.textContent = "Checking Ollama status...";
    try {
      const res  = await fetch("/setup/status");
      const data = await res.json();
      if (data.ready) {
        status.textContent = "Ollama (local). Ready to upload.";
        enableUpload();
      } else {
        runOllamaSetup();
      }
    } catch (e) {
      status.textContent = "Could not reach server.";
    }
  }

  function runOllamaSetup() {
    setupPanel.style.display = "block";
    setupLog.textContent = "";
    setupTitle.textContent = "Setting up Ollama (this may take a few minutes)...";
    setupSpinner.style.display = "inline-block";
    status.textContent = "Installing Ollama and pulling models...";

    const es = new EventSource("/setup/stream");
    es.onmessage = (e) => {
      if (e.data === "__DONE__") {
        es.close();
        setupSpinner.style.display = "none";
        setupTitle.textContent = "Ollama setup complete.";
        status.textContent = "Ollama ready. Upload a file to begin.";
        enableUpload();
        setTimeout(() => { setupPanel.style.display = "none"; }, 4000);
      } else if (e.data.startsWith("__ERROR__")) {
        es.close();
        setupSpinner.style.display = "none";
        setupTitle.textContent = "Setup failed.";
        status.textContent = "Ollama setup failed. Check the log above.";
        setupLog.textContent += `\nERROR: ${e.data}`;
      } else {
        setupLog.textContent += e.data + "\n";
        setupLog.scrollTop = setupLog.scrollHeight;
      }
    };
    es.onerror = () => {
      es.close();
      setupSpinner.style.display = "none";
      setupTitle.textContent = "Setup connection lost.";
      status.textContent = "Lost connection during setup.";
    };
  }

  // Enable file upload when backend is selected
  providerSelect.addEventListener("change", () => {
    const selectedProvider = providerSelect.value;
    const tokensBtn = document.getElementById("tokens-btn");
    setupPanel.style.display = "none";
    if (selectedProvider === "ollama") {
      checkOllamaSetup();
      tokensBtn.style.display = "none";
    } else if (selectedProvider === "gemini") {
      enableUpload();
      status.textContent = "Gemini API selected. Ready to upload.";
      tokensBtn.style.display = "inline-block";
    } else {
      disableUpload();
      status.textContent = "Select a backend to begin.";
      tokensBtn.style.display = "none";
    }
  });

  fileInput.addEventListener("change", async () => {
    const files = Array.from(fileInput.files);
    if (!files.length) return;

    send.disabled = true;
    input.disabled = true;
    const provider = providerSelect.value;

    for (const file of files) {
      status.textContent = `Ingesting ${file.name}...`;
      const form = new FormData();
      form.append("file", file);

      try {
        const res  = await fetch(`/ingest?provider=${provider}`, { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok) {
          status.textContent = `Error ingesting ${file.name}: ${data.error || data.detail || "Ingest failed"}`;
          continue;
        }
        sources.push(data.source);
        currentProvider = provider;
        status.textContent = `${sources.length} file(s) loaded...`;
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
      }
    }

    status.textContent = `${sources.length} file(s) loaded. Ready to chat.`;
    input.disabled = false;
    send.disabled  = false;
    input.focus();
  });

  async function sendMessage() {
    const query = input.value.trim();
    if (!query || !sources.length) return;
    input.value = "";
    send.disabled = true;

    appendMsg(query, "user");

    try {
      const res  = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, source: sources, provider: currentProvider }),
      });
      const data = await res.json();

      if (!res.ok || data.error) {
        appendMsg(`Error: ${data.error || "Chat failed"}`, "bot");
        send.disabled = false;
        input.focus();
        return;
      }

      let sourcesText = "";
      if (data.chunks && data.chunks.length) {
        sourcesText = "\n\nSources:\n" + data.chunks
          .map(c => `  Page ${c.page}  (${c.similarity})  ${c.source.split("/").pop()}`)
          .join("\n");
      }
      const providerText = data.provider ? `\n\n[Answered by: ${data.provider.charAt(0).toUpperCase() + data.provider.slice(1)}]` : "";
      appendMsg(data.answer + sourcesText + providerText, "bot");
    } catch (err) {
      appendMsg(`Error: ${err.message}`, "bot");
    }

    send.disabled = false;
    input.focus();
  }

  send.addEventListener("click", sendMessage);
  input.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });

  async function showTokenUsage() {
    try {
      const res = await fetch('/tokens/summary?provider=gemini');
      if (!res.ok) {
        alert('Token tracking is only available for Gemini provider');
        return;
      }
      const data = await res.json();
      alert(data.summary);
    } catch (error) {
      console.error('Failed to fetch token usage:', error);
      alert('Failed to fetch token usage: ' + error.message);
    }
  }

  function appendMsg(text, role) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    if (role === "bot") {
      div.innerHTML = marked.parse(text);
    } else {
      div.textContent = text;
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }
</script>
</body>
</html>
